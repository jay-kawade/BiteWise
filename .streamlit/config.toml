# BiteWise theme. Colours mirror the tokens in app/components/styles.py --
# if you change one, change the other.

[client]
toolbarMode = "minimal"
showErrorDetails = "stacktrace"

[theme]
base = "light"
primaryColor = "#2F5D3A"
backgroundColor = "#F7F4EE"
secondaryBackgroundColor = "#EFEAE0"
textColor = "#23211C"
borderColor = "#E3DCCF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.6rem"
buttonRadius = "full"
linkColor = "#2F5D3A"
linkUnderline = false

redColor = "#B8432F"
orangeColor = "#D9623B"
yellowColor = "#D99A2B"
greenColor = "#3C7A4E"
blueColor = "#3F6E8C"
violetColor = "#7A5C99"
grayColor = "#8A8478"

font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap, serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseFontSize = 15

chartCategoricalColors = ["#3C7A4E", "#D9623B", "#D99A2B", "#7A5C99", "#3F6E8C"]

[theme.sidebar]
backgroundColor = "#EFEAE0"
secondaryBackgroundColor = "#FFFFFF"
